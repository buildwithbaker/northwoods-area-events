# Auto-merges the weekly Northwoods scan PR, then deploys (added 2026-11-08).
#
# The weekly scan pushes branch weekly-scan-YYYY-MM-DD and opens a PR. It no
# longer merges it: the Claude Code auto-mode classifier refuses an unattended
# merge ("Merge Without Review"). This workflow merges it instead, but ONLY when
# .github/scripts/validate_scan.py passes - exactly one file changed, data-only
# edit, LAST_SCAN matches the branch date and is newer than main, the events
# list did not shrink more than 40%, and the data block parses.
#
# pull_request_target runs this file and the validator from MAIN, never from the
# PR, so a PR cannot loosen its own gate. Nothing from the PR is executed: the
# validator reads index.html with git and syntax-checks it with node --check.
# A failed check leaves the PR open and fails this run, which GitHub emails.
name: Weekly scan auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: scan-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-and-merge:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'weekly-scan-') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'buildwithbaker' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out main (the trusted copy of the validator)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR head without checking it out
        run: git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"

      - name: Validate the scan
        run: python3 .github/scripts/validate_scan.py

      - name: Squash-merge
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"

      - name: Request the Pages deploy
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

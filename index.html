<style>
/* Colour tokens, named by role. Values unchanged from before the rename; old name -> new name:
   --bg -> --surface (page)                --card -> --surface-container (lists, sheets, the bar)
   --surface -> --surface-container-high   --text -> --on-surface
   --neutral -> --on-surface-variant       --desc -> --on-surface-muted
   --neutral-border -> --outline           --neutral-soft -> --outline-variant
   --primary -> --primary                  #fff on primary -> --on-primary
   --primary-soft -> --primary-container   --primary-deep -> --on-primary-container
   --accent -> --accent                    --accent-soft -> --accent-container
   --accent-ink -> --accent-ink (day headers and soon badges)
   --link -> --link                        --stale -> --error
   The theme is the app's choice (data-theme), never the phone's. */
:root{
  --primary:#2E5082; --on-primary:#FFFFFF; --on-primary-container:#25406A; --primary-container:#E4EAF4;
  --accent:#A07020; --accent-ink:#7A520F; --accent-container:#F2E5C9;
  --on-surface-variant:#526070; --outline:#B0BAC8; --outline-variant:#DDE2EA;
  --surface:#EFF2F7; --surface-container:#FFFFFF; --surface-container-high:#FFFFFF; --on-surface-muted:#3c4654;
  --on-surface:#1A1F2B; --link:#2E5082; --error:#8A1C1C;
  --bar-shadow:0 2px 8px rgba(8,12,20,.12); --sheet-shadow:0 -4px 24px rgba(8,12,20,.2);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  /* motion */
  --ease-standard:cubic-bezier(0.2, 0, 0, 1); --ease-emph-decel:cubic-bezier(0.05, 0.7, 0.1, 1); --ease-emph-accel:cubic-bezier(0.3, 0, 0.8, 0.15);
  --dur-short3:150ms; --dur-short4:200ms;
  --spring-ios-default:linear(0, 0.082, 0.243, 0.413, 0.562, 0.682, 0.774, 0.841, 0.89, 0.925, 0.949, 0.965, 0.977, 0.984, 0.99, 0.993, 1);
  --ease-sheet:var(--ease-emph-decel);
  /* category tint families: container and glyph/tag text (glyph 5.9:1 or more) */
  --fam-music:#EEEDFE; --on-fam-music:#3C3489; --fam-celebrate:#FAEEDA; --on-fam-celebrate:#7A5410;
  --fam-community:#E3EEF3; --on-fam-community:#1E4A5E; --fam-outdoors:#E4F0E1; --on-fam-outdoors:#24552B;
  --fam-play:#FBEAF0; --on-fam-play:#72243E; --fam-neutral:#EDEFF3; --on-fam-neutral:#3A3F4A;
  --bar-h:0px; --gh-h:0px; --tabs-h:0px; color-scheme:light;
}
:root[data-theme="dark"]{
  --primary:#33598C; --on-primary:#FFFFFF; --on-primary-container:#22344F; --primary-container:#22344F;
  --accent:#D6A24A; --accent-ink:#E2B462; --accent-container:#3A3320;
  --on-surface-variant:#9AA6B6; --outline:#3A4556; --outline-variant:#2A3342;
  --surface:#0F1420; --surface-container:#1B2330; --surface-container-high:#222C3C; --on-surface-muted:#C2CAD6;
  --on-surface:#E7EBF1; --link:#9CBBE8; --error:#F2A7A7;
  --bar-shadow:0 2px 8px rgba(0,0,0,.5); --sheet-shadow:0 -4px 24px rgba(0,0,0,.6);
  /* dark families: containers at relative luminance 0.047 or less, glyphs 7:1 or more */
  --fam-music:#34306A; --on-fam-music:#D2CDFF; --fam-celebrate:#4A3710; --on-fam-celebrate:#F5CD7A;
  --fam-community:#1D405C; --on-fam-community:#A9D6F2; --fam-outdoors:#1E4526; --on-fam-outdoors:#A8E0AE;
  --fam-play:#55223F; --on-fam-play:#F8B7D0; --fam-neutral:#343C4C; --on-fam-neutral:#D0D6E0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Phosphor icons: one hidden sprite, drawn with <use>; fill follows the text colour */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
svg.i{fill:currentColor;flex-shrink:0}
/* --sl/--sr: side gutters that clear a notch in landscape (viewport-fit=cover) */
:root{--sl:max(16px,env(safe-area-inset-left));--sr:max(16px,env(safe-area-inset-right))}
/* 1rem follows the phone's text size: iPhone Settings via -apple-system-body (17px default), Chrome via the text-scale meta.
   Elsewhere the shorthand is ignored and 1rem stays 16px. Inter stays the face. */
html{font:-apple-system-body;font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
/* macOS Safari also knows -apple-system-body: keep the browser default there */
@supports (font: -apple-system-body) and (not (-webkit-touch-callout: default)){:root{font-size:100%}}
/* keep a focused item clear of the sticky bar plus one day header */
html{background:var(--surface);-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + max(60px, var(--gh-h) + 12px));scroll-padding-bottom:calc(var(--tabs-h) + 8px)}
body{font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--surface);color:var(--on-surface);line-height:1.5;font-size:1rem;overflow-x:hidden;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
:root[data-theme="dark"] :focus-visible{outline-color:var(--link)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* phones: room for the bottom tab bar (--tabs-h, measured, includes the safe area) */
.shell{max-width:1200px;margin:0 auto;padding:0 var(--sr) calc(var(--tabs-h) + 24px) var(--sl)}
/* large title: scrolls away; the bar then shows the short title */
.top{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;padding:max(16px,env(safe-area-inset-top)) 0 12px}
/* the title keeps at least 1.25rem per its longest word; below that the buttons wrap under it */
.top .ttl{flex:1 1 calc(1.25rem * 6.3);min-width:0;container-type:inline-size}
.top h1{font-size:1.75rem;font-weight:700;letter-spacing:-.2px;line-height:1.2;color:var(--on-primary-container);overflow-wrap:anywhere}
/* one line with the app mark at normal text sizes (text about 12em + mark 1.15em + gap .35em);
   at large text it never drops below body size and wraps instead */
.top h1{display:flex;align-items:center;gap:.35em;font-size:min(1.75rem, max(100cqi / 13.8, 1rem))}
.top h1 .mark{flex:0 0 auto;width:1.15em;height:1.15em}
.top h1 .tt{min-width:0}
:root[data-theme="dark"] .top h1{color:var(--on-surface)}
.top .subtitle{display:none;font-size:.875rem;color:var(--on-surface-variant);margin-top:4px}
.meta{font-size:.75rem;color:var(--on-surface-variant)}
/* an overdue scan is loud wherever it shows: the bar, under the title, About */
.stale{color:var(--error);font-weight:600}
.top .meta{display:none;margin-top:4px}
.topbtns{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto}
.iconbtn{flex-shrink:0;width:44px;height:44px;border-radius:var(--r-md);border:1px solid var(--outline);background:var(--surface-container-high);color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.installbtn{flex-shrink:0;min-height:44px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--primary);background:var(--primary-container);color:var(--on-primary-container);font-size:.9375rem;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
.installbtn[hidden]{display:none}
.installbtn svg{width:16px;height:16px;flex-shrink:0}
@media (max-width:359px){.installbtn{padding:0 8px}.installbtn svg{display:none}}
:root[data-theme="dark"] .installbtn{border-color:var(--link);color:#fff}

/* sticky bar: an opaque layer over the page, with a shadow only while content is under it */
.bar{position:sticky;top:0;z-index:20;background:var(--surface-container);padding:8px var(--sr) 8px var(--sl);margin:0 calc(-1 * var(--sr)) 0 calc(-1 * var(--sl));border-bottom:1px solid var(--outline-variant)}
.bar.under{box-shadow:var(--bar-shadow)}
/* freshness line and short title share one cell, so collapsing never changes the bar's height */
.row0{display:flex;align-items:center;gap:8px;margin-bottom:4px;min-width:0}
.r0c{display:grid;align-items:center;flex:1 1 auto;min-width:0}
.r0c>*{grid-area:1 / 1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row0 .short{font-size:1rem;font-weight:700;line-height:1.25;color:var(--on-surface);visibility:hidden}
.bar.collapsed .row0 .short{visibility:visible}
.bar.collapsed .row0 .meta{visibility:hidden}
/* home town: always one tap away in the sticky bar; ~32px to the eye, 44px hit area */
.homebtn{position:relative;flex:0 1 auto;max-width:60%;display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 8px 0 10px;border-radius:var(--r-pill);border:1px solid var(--outline);background:var(--surface-container-high);color:var(--on-surface);font-size:.875rem;font-weight:600;cursor:pointer;white-space:nowrap}
.homebtn::after{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
.homebtn .hn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.homebtn svg{width:16px;height:16px;flex-shrink:0}
.homebtn .pin{color:var(--primary)}
:root[data-theme="dark"] .homebtn .pin{color:var(--link)}
.homebtn.unset{border-color:var(--primary);background:var(--primary-container);color:var(--on-primary-container)}
:root[data-theme="dark"] .homebtn.unset{color:#fff}
.row1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* the field keeps room for its placeholder; when it cannot, Date / Nearest wraps under it */
.sw{position:relative;flex:1 1 calc(52px + 3.5em);min-width:0}
.sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--on-surface-variant);pointer-events:none}
/* the one px font size: iPhone zooms on focus below 16px */
.search{width:100%;min-height:44px;padding:0 12px 0 40px;border:1px solid var(--outline);border-radius:var(--r-md);font-size:max(16px,1rem);background:var(--surface-container-high)}
.seg{display:inline-flex;flex:0 0 auto;border:1px solid var(--outline);border-radius:var(--r-md);background:var(--surface-container-high);padding:4px;min-height:44px}
.seg button{border:0;background:transparent;border-radius:var(--r-sm);padding:0 12px;font-size:.9375rem;font-weight:600;color:var(--on-surface-variant);cursor:pointer;min-width:52px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.search::placeholder{color:var(--on-surface-variant)}
/* phone filters: below the sticky search row and scroll away with the page; nothing scrolls sideways */
.chips{display:flex;flex-direction:column;gap:8px;padding:12px 0 4px}
.chips:empty{display:none}
/* the four date chips: one row from 360px, wrapping (never scrolling) below that */
.daterow{display:flex;flex-wrap:wrap;gap:12px 8px}
/* about 36px to the eye, with a 48px hit area */
.chip{position:relative;flex-shrink:0;min-height:36px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--outline);background:var(--surface-container-high);font-size:.875rem;font-weight:500;color:var(--on-surface);cursor:pointer;white-space:nowrap}
.chip::after,.achip::after,.aclear::after{content:"";position:absolute;left:0;right:0;top:50%;height:48px;transform:translateY(-50%)}
.chip[aria-pressed="true"]{background:var(--primary-container);border-color:var(--primary);color:var(--on-primary-container)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#fff}
/* Filters: an icon button with a badge counting the active sheet settings */
.fbtn{position:relative;flex:0 0 auto;width:44px;height:44px;border-radius:var(--r-md);border:1px solid var(--outline);background:var(--surface-container-high);color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.fbtn svg{width:20px;height:20px}
.fbtn.on{border-color:var(--primary);background:var(--primary-container);color:var(--on-primary-container)}
:root[data-theme="dark"] .fbtn.on{color:#fff}
/* sized in em so it grows with the text size; it overhangs the corner by design */
.fbtn .badge{position:absolute;top:-.5em;right:-.5em;min-width:1.6em;height:1.6em;padding:0 4px;border-radius:var(--r-pill);background:var(--primary);color:var(--on-primary);font-size:.6875rem;font-weight:700;line-height:1.6em;text-align:center}
.fbtn .badge[hidden]{display:none}
/* applied filters: one removable chip per setting, then Clear all */
.applied{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.applied[hidden]{display:none}
.achip{position:relative;display:inline-flex;align-items:center;gap:4px;min-height:32px;max-width:100%;padding:0 8px 0 12px;border-radius:var(--r-pill);border:1px solid var(--primary);background:var(--primary-container);color:var(--on-primary-container);font-size:.875rem;font-weight:500;text-align:left;overflow-wrap:anywhere;cursor:pointer}
:root[data-theme="dark"] .achip{color:#fff}
.achip svg{width:16px;height:16px;flex-shrink:0}
.aclear{position:relative;min-height:32px;padding:0 8px;border:0;background:none;color:var(--link);font-size:.875rem;font-weight:600;text-decoration:underline;cursor:pointer}

/* first run: what this is, and the one setting that matters (home town). Dismissible; gone once a town is set. */
.hello{position:relative;margin-top:12px;padding:12px 16px;border-radius:var(--r-md);border:1px solid var(--primary);background:var(--primary-container);color:var(--on-primary-container)}
.hello[hidden]{display:none}
:root[data-theme="dark"] .hello{color:var(--on-surface)}
.hello h2{font-size:1rem;font-weight:700;line-height:1.3;padding-right:36px}
.hello p{margin-top:2px;font-size:.875rem;line-height:1.4;padding-right:8px}
.hello .eacts{margin-top:10px}
.hello .eact{padding:0 14px}
@media (max-width:359px){.hello{padding:12px}.hello .eact{padding:0 12px}.hello .eact svg{display:none}}
.hello .eact.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.hello .eact svg{width:18px;height:18px;margin-right:6px;vertical-align:-3px}
.hello .hx{position:absolute;top:0;right:0;width:44px;height:44px;border:0;border-radius:var(--r-pill);background:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.hello .hx svg{width:18px;height:18px}
.geonote .eact{display:inline-flex;align-items:center;margin-top:8px;min-height:40px}
/* results: flat cards, no shadows */
.side{display:none}
/* the count line keeps one height (two lines reserved), so the list never jumps as the count changes */
.count{font-size:.875rem;line-height:1.5;height:1.5em;color:var(--on-surface-variant);margin:8px 2px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.geonote{font-size:.875rem;color:var(--on-surface);background:var(--primary-container);border:1px solid var(--primary);border-radius:var(--r-md);padding:8px 12px;margin-top:12px}
.geonote[hidden]{display:none}
.ghead{position:sticky;top:var(--bar-h);z-index:10;background:var(--surface);display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:12px 2px 8px;font-size:.8125rem;font-weight:600;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em}
.ghead .n{color:var(--on-surface-variant);font-weight:600;letter-spacing:0}
.ghead .sub{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--on-surface-variant);font-size:.8125rem}
.list{background:var(--surface-container);border:1px solid var(--outline);border-radius:var(--r-md);overflow:hidden}
/* every matching event is in the DOM (rendered in chunks) */
/* a row is one button that opens the event sheet; spans styled as blocks (a button holds phrasing content only) */
.ev{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;width:100%;min-height:56px;padding:12px 16px;border:0;border-top:1px solid var(--outline-variant);border-radius:0;background:none;text-align:left;cursor:pointer;min-width:0}
.ev:first-child{border-top:0}
.itile{flex:0 0 40px;width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center}
.itile svg{width:22px;height:22px}
/* the body keeps room for the title; at large text the slot drops below it rather than squeeze it */
.ev .body{display:block;flex:1 1 min(8em, calc(100% - 52px));min-width:0}
.ev .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:1rem;font-weight:600;line-height:1.25;color:var(--on-surface);overflow-wrap:anywhere}
/* meta line: wraps between its pieces (town, miles, category), never inside one; two lines at most */
.ev .meta2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;font-size:.875rem;line-height:1.3;color:var(--on-surface-variant);overflow-wrap:anywhere}
.ev .meta2 .mp{white-space:nowrap}
/* trailing slot: time on top, the run or extra-dates note below; takes no width when empty */
.slot{flex:0 0 auto;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;text-align:right;white-space:nowrap;line-height:1.3}
.slot .s1{font-size:.875rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--on-surface)}
.slot .s2{font-size:.8125rem;color:var(--on-surface-variant)}
.fam-music{background:var(--fam-music);color:var(--on-fam-music)}
.fam-celebrate{background:var(--fam-celebrate);color:var(--on-fam-celebrate)}
.fam-community{background:var(--fam-community);color:var(--on-fam-community)}
.fam-outdoors{background:var(--fam-outdoors);color:var(--on-fam-outdoors)}
.fam-play{background:var(--fam-play);color:var(--on-fam-play)}
.fam-neutral{background:var(--fam-neutral);color:var(--on-fam-neutral)}
.tag{display:inline-block;max-width:100%;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);overflow-wrap:anywhere}
.ongoing{margin-top:12px}
.ongoing summary,.mbnote summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:48px;padding:12px 16px;background:var(--surface-container);border:1px solid var(--outline);border-radius:var(--r-md);font-size:.9375rem;font-weight:600}
.ongoing summary::-webkit-details-marker,.mbnote summary::-webkit-details-marker{display:none}
.ongoing summary .n{color:var(--on-surface-variant);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ongoing summary .lbl{white-space:nowrap}
.ongoing summary .chev,.mbnote summary .chev{margin-left:auto;display:inline-flex;transition:transform var(--dur-short4) var(--ease-standard)}
.ongoing summary .chev svg,.mbnote summary .chev svg{width:18px;height:18px}
.ongoing[open] summary,.mbnote[open] summary{border-radius:var(--r-md) var(--r-md) 0 0;border-bottom-color:var(--outline-variant)}
.ongoing[open] summary .chev,.mbnote[open] summary .chev{transform:rotate(180deg)}
.ongoing[open] .list{border-top:0;border-radius:0 0 var(--r-md) var(--r-md)}
/* My Bands criteria: a quiet row at the end of the list */
.mbnote{margin-top:12px}
.mbnote summary{font-weight:500;color:var(--on-surface-variant)}
.mbnote p{padding:12px 16px;background:var(--surface-container);border:1px solid var(--outline);border-top:0;border-radius:0 0 var(--r-md) var(--r-md);font-size:.9375rem;color:var(--on-surface-muted)}
.empty{padding:20px 16px;background:var(--surface-container);border:1px solid var(--outline);border-radius:var(--r-md);color:var(--on-surface-variant);font-size:.9375rem;margin-top:12px}
.empty .emsg{color:var(--on-surface);font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.empty .enote{margin-top:8px}
.eacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.eact{min-height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--link);background:var(--surface-container-high);color:var(--link);font-size:.9375rem;font-weight:600;cursor:pointer}

/* views: Weekly has no date sort or date chips; Saved ignores search and filters */
[data-view="weekly"] .seg,[data-view="saved"] .row1,[data-view="saved"] #chips{display:none}
.savednote{font-size:.875rem;color:var(--on-surface-variant);margin:12px 2px 0}
.past{margin-top:12px}
/* bottom tab bar: phones only, three destinations, no actions */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface-container);border-top:1px solid var(--outline-variant);padding:0 var(--sr) env(safe-area-inset-bottom) var(--sl)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;padding:8px 4px;color:var(--on-surface-variant);text-decoration:none;font-size:.75rem;font-weight:600;line-height:1.25;text-align:center;cursor:pointer;min-width:0}
.tab .ic{display:grid;place-items:center;width:56px;max-width:100%;height:28px;border-radius:var(--r-pill)}
.tab .ic svg{width:22px;height:22px}
.tab .tl{max-width:100%;overflow-wrap:anywhere}
.tab[aria-current="page"]{color:var(--on-surface)}
.tab[aria-current="page"] .ic{background:var(--primary-container);color:var(--on-primary-container)}
:root[data-theme="dark"] .tab[aria-current="page"] .ic{color:#fff}
.tab:focus-visible{outline-offset:-2px}

/* short screens (landscape phones, big zoom): the bar scrolls away instead of sticking */
@media (max-height:500px){.bar{position:static} .ghead{top:0} html{scroll-padding-top:max(60px, var(--gh-h) + 12px)}}

/* desktop: sidebar filters + results */
@media (min-width:960px){
  .shell{padding:0 32px 64px}
  .top{padding:24px 0 16px}
  .top .subtitle{display:block}
  .top .meta{display:block}
  .row0{display:none}
  .tabs{display:none}
  .layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}
  .bar{margin:0;padding:0 4px 8px 0;border:0;background:none;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain}
  .bar.under{box-shadow:none}
  .chips,.fbtn{display:none}
  .row1{flex-direction:column;align-items:stretch}
  .sw{flex:none}
  .seg{width:100%}
  .seg button{flex:1}
  .side{display:block;margin-top:16px}
  .side h2{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--on-surface-variant);margin:16px 0 8px}
  .side .opt{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:8px 12px;border:0;border-radius:var(--r-sm);background:none;font-size:.9375rem;text-align:left;cursor:pointer}
  @media (hover: hover){.side .opt:hover{background:var(--outline-variant)}}
  .side .opt[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container);font-weight:700}
  :root[data-theme="dark"] .side .opt[aria-pressed="true"]{color:#fff}
  .side .opt .n{color:var(--on-surface-variant);font-size:.75rem;font-weight:500}
  .side .optdate{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:36px;padding:8px 12px;border-radius:var(--r-sm);font-size:.9375rem;cursor:pointer}
  .side .optdate.on{background:var(--primary-container);color:var(--on-primary-container);font-weight:700}
  :root[data-theme="dark"] .side .optdate.on{color:#fff}
  .side .optdate input{min-height:32px;padding:0 8px;border:1px solid var(--outline);border-radius:var(--r-sm);background:var(--surface-container-high);font-size:1rem;color:var(--on-surface);font-weight:400;max-width:100%}
  .ghead{top:0}
  .ev{padding:16px 20px}
}

/* touch: no grey tap flash, and an instant press state (no transition) on every control and event link */
button,.fo,.optdate,summary,.sh-btn,.ab-row,.tab{-webkit-tap-highlight-color:transparent}
/* controls only: no double-tap zoom delay, no text selection; event text stays selectable in the sheet */
button,.fo,.optdate,summary,.sh-btn,.ab-row,.tab{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active,.chip:active,.seg button:active,.sh-btn:active{transform:scale(.97)}
.side .opt:active,.ev:active,.ab-switch:active{transform:none;background:var(--outline-variant)}
summary:active,.ab-row:active,.tab:active,.fo:not(.off):active{background:var(--outline-variant)}
@media (hover: hover){.ev:hover{background:var(--surface)}}
/* the list clips its corners, so draw the row's focus ring inside it */
.ev:focus-visible,.ab-row:focus-visible,.ab-switch:focus-visible{outline-offset:-2px}

/* sheets (event, About): anchored to the bottom on phones, centered at 960px+. No transition (motion is a later piece). */
html.sheet-open{overflow:hidden}
.sheet{position:fixed;inset:auto 0 0 0;margin:0;width:100%;max-width:none;max-height:85vh;max-height:85dvh;padding:0;border:0;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--surface-container);color:var(--on-surface);box-shadow:var(--sheet-shadow);overflow-y:auto;overscroll-behavior:contain}
.sheet::backdrop{background:rgba(8,12,20,.55)}
/* Sheets slide up over 600ms (a spring where linear() easing exists), the scrim fades in over 150ms;
   they slide down over 220ms before close() runs. Only sheets, tab switches and chevrons move. */
@supports (transition-timing-function: linear(0, 1)){:root{--ease-sheet:var(--spring-ios-default)}}
.sheet{transform:translateY(0);transition:transform 600ms var(--ease-sheet)}
@starting-style{.sheet[open]{transform:translateY(100%)}}
.sheet.closing{transform:translateY(100%);transition:transform 220ms var(--ease-emph-accel)}
.sheet::backdrop{opacity:1;transition:opacity 150ms linear}
@starting-style{.sheet[open]::backdrop{opacity:0}}
.sheet.closing::backdrop{opacity:0;transition:opacity 220ms linear}
.sh-in{padding:0 var(--sr) calc(24px + env(safe-area-inset-bottom)) var(--sl)}
.sh-top{position:sticky;top:0;z-index:1;display:flex;justify-content:flex-end;padding:16px 0 4px;background:var(--surface-container)}
.grab{position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:var(--r-pill);background:var(--outline)}
.sh-close{min-height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--outline);background:var(--surface-container-high);font-size:.9375rem;font-weight:600;cursor:pointer}
.sh-title{font-size:1.25rem;font-weight:700;line-height:1.25;margin:4px 0 8px;overflow-wrap:anywhere}
.sh-date{font-weight:600}
.sh-venue{margin-top:4px;overflow-wrap:anywhere}
.sh-dist{margin-top:4px;font-size:.875rem;color:var(--on-surface-variant);overflow-wrap:anywhere}
.sh-dist b{color:var(--on-surface);font-weight:600}
.sh-desc{margin-top:12px;font-size:.9375rem;color:var(--on-surface-muted);overflow-wrap:anywhere}
.sh-tags{margin-top:12px}
.sh-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sh-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;text-align:left;border-radius:var(--r-pill);border:1px solid var(--link);background:var(--surface-container-high);color:var(--link);font-size:.9375rem;font-weight:600;text-decoration:none;cursor:pointer;overflow-wrap:anywhere}
.sh-btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sh-btn svg{width:18px;height:18px;margin-right:8px;flex-shrink:0}
.sh-btn[aria-pressed="true"]{background:var(--primary-container);border-color:var(--primary);color:var(--on-primary-container)}
:root[data-theme="dark"] .sh-btn[aria-pressed="true"]{color:#fff}
.sh-acts+.sh-acts{margin-top:8px}
.sh-gone{margin-bottom:4px;font-weight:600;color:var(--error)}
.sh-live{margin-top:12px;font-size:.875rem;font-weight:600}
.sh-live:empty{margin:0}
.sh-link{display:block;margin-top:12px;font-size:.875rem;color:var(--on-surface-variant)}
.sh-link[hidden]{display:none}
.sh-link input{display:block;width:100%;min-height:44px;margin-top:4px;padding:0 12px;border:1px solid var(--outline);border-radius:var(--r-sm);background:var(--surface-container-high);font-size:1rem}
/* event sheet: source and "more in town" as quiet rows; calendar choices fold under one button */
.sh-when{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:var(--r-pill);background:var(--accent-container);color:var(--accent-ink);font-size:.8125rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;vertical-align:2px}
.sh-rows{list-style:none;margin-top:16px;border-top:1px solid var(--outline-variant)}
.sh-rows li{border-bottom:1px solid var(--outline-variant)}
.sh-row{display:flex;width:100%;align-items:center;gap:12px;min-height:48px;padding:8px 2px;border:0;background:none;color:var(--on-surface);font-size:.9375rem;text-align:left;text-decoration:none;cursor:pointer;overflow-wrap:anywhere}
.sh-row .k{color:var(--on-surface-variant);flex-shrink:0}
.sh-row .v{flex:1 1 auto;min-width:0;font-weight:600;color:var(--link)}
.sh-row svg{width:16px;height:16px;flex-shrink:0;color:var(--on-surface-variant)}
.sh-btn[aria-expanded="true"]{background:var(--primary-container);border-color:var(--primary);color:var(--on-primary-container)}
:root[data-theme="dark"] .sh-btn[aria-expanded="true"]{color:#fff}
.calx-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.calx-opts[hidden]{display:none}
.sh-dist .sh-set{border:0;background:none;padding:0;color:var(--link);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
/* home-town sheet */
.hp-lead{font-size:.9375rem;color:var(--on-surface-muted)}
.hp-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hp-find{position:relative;margin-top:16px}
.hp-find svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--on-surface-variant);pointer-events:none}
.hp-find input{width:100%;min-height:44px;padding:0 12px 0 40px;border:1px solid var(--outline);border-radius:var(--r-md);background:var(--surface-container-high);font-size:max(16px,1rem)}
.hp-none{margin-top:12px;font-size:.9375rem;color:var(--on-surface-variant)}
.fs[hidden],.fl li[hidden]{display:none}
.fo .sub{display:block;font-size:.8125rem;color:var(--on-surface-variant)}
/* Filters sheet */
.fs{border:0;margin-top:20px;min-width:0}
.fs legend{padding:0;margin-bottom:8px;font-size:.8125rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--on-surface-variant)}
.fl{list-style:none;background:var(--surface-container-high);border:1px solid var(--outline);border-radius:var(--r-md);overflow:hidden}
.fl li+li{border-top:1px solid var(--outline-variant)}
.fo{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 16px;font-size:.9375rem;cursor:pointer}
.fo input{flex-shrink:0;width:20px;height:20px;margin:0;accent-color:var(--primary)}
.fo .n{margin-left:auto;padding-left:8px;font-size:.875rem;color:var(--on-surface-variant)}
.fo.off{color:var(--on-surface-variant);cursor:default}
.fdate{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;padding-right:16px}
.fdate .fo{flex:1 1 auto}
.fdate input[type="date"]{flex:1 1 9em;min-height:40px;margin:0 0 8px 48px;padding:0 8px;border:1px solid var(--outline);border-radius:var(--r-sm);background:var(--surface-container);font-size:1rem;color:var(--on-surface);min-width:0}
.fs-foot{position:sticky;bottom:0;margin-top:16px;padding:12px 0 4px;background:var(--surface-container)}
.fs-foot .sh-btn{width:100%}
/* About */
.ab-sec{margin-top:20px}
.ab-sec h3{font-size:.8125rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--on-surface-variant);margin-bottom:8px}
.ab-sec p{font-size:.9375rem;color:var(--on-surface-muted)}
.ab-sec p+p,.ab-list+p,.ab-switch+p{margin-top:12px}
.ab-sec p a{color:var(--link)}
.ab-sec strong{color:var(--on-surface)}
.ab-list{list-style:none;background:var(--surface-container-high);border:1px solid var(--outline);border-radius:var(--r-md);overflow:hidden}
.ab-list li+li{border-top:1px solid var(--outline-variant)}
.ab-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:8px 16px;font-size:.9375rem;color:var(--on-surface);text-decoration:none}
.ab-row svg{width:16px;height:16px;flex-shrink:0;color:var(--on-surface-variant)}
/* About rows that are buttons (Home town, Share this app): no browser button fill, same look as the link rows */
button.ab-row{width:100%;border:0;background:none;font-family:inherit;text-align:left;cursor:pointer}
.ab-switch{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:8px 16px;border:1px solid var(--outline);border-radius:var(--r-md);background:var(--surface-container-high);font-size:.9375rem;font-weight:600;text-align:left;cursor:pointer}
.ab-switch+.ab-switch{margin-top:8px}
.ab-switch .track{position:relative;flex-shrink:0;width:44px;height:24px;border-radius:var(--r-pill);background:var(--outline-variant);border:1px solid var(--outline)}
.ab-switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:var(--r-pill);background:var(--on-surface-variant)}
.ab-switch[aria-checked="true"] .track{background:var(--primary);border-color:var(--primary)}
.ab-switch[aria-checked="true"] .knob{left:22px;background:var(--on-primary)}
@media (min-width:960px){
  .sheet{inset:0;margin:auto;width:calc(100% - 64px);max-width:560px;max-height:85vh;border-radius:var(--r-lg);box-shadow:0 8px 32px rgba(8,12,20,.3)}
  /* the centred dialog fades instead of sliding */
  .sheet{transform:none;opacity:1;transition:opacity var(--dur-short3) var(--ease-standard)}
  @starting-style{.sheet[open]{transform:none;opacity:0}}
  .sheet.closing{transform:none;opacity:0;transition:opacity var(--dur-short3) var(--ease-standard)}
  .grab{display:none}
}

/* tab switches: a ~200ms cross-fade (View Transitions) */
::view-transition-group(root),::view-transition-old(root),::view-transition-new(root){animation-duration:200ms;animation-timing-function:cubic-bezier(0.2, 0, 0, 1)}
/* phones up to 360px: a row's slot note goes under the meta line, so the meta line (and its distance) gets the full width */
@media (max-width:360px){.ev .slot:has(.s2){flex-basis:100%}}
/* reduced motion: nothing moves (sheets appear in place; tab switches skip the View Transition in script) */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after,.sheet::backdrop{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important;transition-delay:0s !important;scroll-behavior:auto !important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation-duration:1ms !important}
  .sheet,.sheet.closing{transform:none !important}
}

/* installed app: the browser's install offer is moot */
@media (display-mode: standalone){#installBtn{display:none}}
</style>

{const bad=[...EVENTS,...RECURRING].filter(o=>o.time!==undefined&&!parseTime(o.time));

// Motion: honour reduced motion; tab switches cross-fade through a View Transition when there is one.

// When the results change, jump (no smooth scroll) to their top, but only if it has gone above the viewport.

document.addEventListener("click",ev=>{
  const tab=ev.target.closest("a[data-tab]");
  if(tab){if(ev.button||ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.altKey)return;ev.preventDefault();setTabs(tab.dataset.tab);if(go({mode:tab.dataset.tab}))withTabTransition(o=>render(o));return;}
  const b=ev.target.closest("button");if(!b)return;
  if(b.classList.contains("ev")&&b.dataset.ev){openFromRow(b.dataset.ev);return;}
  if(b.id==="aboutBtn"){openAs("about");return;}
  if(b.id==="filtersBtn"){openAs("filters");return;}
  if(b.id==="homeBtn"||b.hasAttribute("data-homepick")){openHome();return;}
  if(b.dataset.h&&!b.closest("#sheet")){helloAct(b.dataset.h);return;}
  if(b.dataset.rm){removeApplied(b.dataset.rm);return;}
  if(b.closest("#sheet"))return;
  if(b.dataset.act){emptyAct(b.dataset.act);return;}
  // Destinations push a history entry (Back undoes them); refinements replace the current one.
  if(b.dataset.mode){pressNow(b);if(go({mode:b.dataset.mode}))withTabTransition(o=>render(o));return;}
  if(b.dataset.sort){

    if(b.dataset.sort==="place"&&!HOME){pendingNearest=true;openHome();return;}
    pressNow(b);if(go({sort:b.dataset.sort,mode:"upcoming"}))renderSoon();return;}
  // Sidebar categories toggle independently; All categories clears them.
  if(b.dataset.cat!==undefined){const c=b.dataset.cat,a=c?(cats().includes(c)?cats().filter(x=>x!==c):[...cats(),c]):[];refine({cat:catKey(a)});
    document.querySelectorAll("#side [data-cat]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.cat?a.includes(x.dataset.cat):!a.length));renderSoon();return;}
  if(b.dataset.when)refine({when:b.dataset.when,mode:"upcoming"});

// A tapped chip, segment or sidebar option shows as selected at once; the list is rebuilt after that repaint.

  say("Finding your location...");
  try{navigator.geolocation.getCurrentPosition(p=>{
      const[k,d]=nearestHome(p.coords.latitude,p.coords.longitude);
      if(!k||d>60){nope(`You look to be ${Math.round(d)} miles from the nearest listed town${k?` (${homeName(k)})`:""}.`);return;}
      done(k,Math.round(d));
    },err=>nope(err&&err.code===1?"Location permission was denied.":err&&err.code===3?"Finding your location timed out.":"Your location isn't available."),

// --- history: go() pushes destinations, refine() replaces; render() only ever replaces ---
const VIEWKEYS=["mode","sort","when","cat","dist","town","q"];

const PL=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
// OPEN: the open sheet, an event id or "about". Only an event id goes in the URL; About is marked in history.state.
let OPEN=null;
const SHEETS=["about","filters","home"];
const evOf=o=>o&&!SHEETS.includes(o)?o:"";

const viewOf=()=>({mode:S.mode,sort:S.sort,when:S.when,cat:S.cat,dist:S.dist,town:S.town,q:S.qt});
function urlFor(v,ev){
  // categories as repeated keys: cat=Concert&cat=Festival
  const u=new URLSearchParams();VIEWKEYS.forEach(k=>{if(k==="cat"){if(v.cat)v.cat.split("\n").forEach(c=>u.append("cat",c));}else if(v[k]!==DEF[k])u.set(k,v[k]);});if(ev)u.set("ev",ev);

}
function curState(){try{return history.state&&typeof history.state==="object"?history.state:{};}catch(e){return {};}}
// Rewrite the current entry for the current view, keeping its scroll position and sheet mark.
function replaceURL(){
  const c=curState();
  try{history.replaceState({...viewOf(),ev:evOf(OPEN),about:OPEN==="about",filters:OPEN==="filters",home:OPEN==="home",y:typeof c.y==="number"?c.y:0,sheet:OPEN?c.sheet||"":""},"",urlFor(viewOf(),evOf(OPEN)));}catch(e){}
}
function applyView(v){S.mode=v.mode;S.sort=v.sort;S.when=v.when;S.cat=v.cat;S.dist=v.dist;S.town=v.town||"";S.qt=v.q;S.q=v.q.toLowerCase();}
// Destinations: call from a tap or key handler only (Chrome skips entries pushed without a user gesture).
function go(patch){
  const cur={...viewOf(),open:OPEN||""},next={...cur,...patch};
  if(Object.keys(next).every(k=>next[k]===cur[k]))return false;
  try{history.replaceState({...curState(),y:scrollY},"");}catch(e){}
  if(VIEWKEYS.some(k=>next[k]!==cur[k])){applyView(next);}
  try{history.pushState({...viewOf(),ev:evOf(next.open),about:next.open==="about",filters:next.open==="filters",home:next.open==="home",y:scrollY,sheet:next.open?PL:""},"",urlFor(viewOf(),evOf(next.open)));}catch(e){}
  return true;
}
// Refinements: the caller renders, and render() replaces the entry.
function refine(patch){if("q" in patch){S.qt=patch.q;S.q=patch.q.toLowerCase();delete patch.q;}Object.assign(S,patch);}
addEventListener("pagehide",()=>{try{history.replaceState({...curState(),y:scrollY},"");}catch(e){}});
addEventListener("popstate",e=>{
  const st=e.state&&typeof e.state==="object"&&e.state.mode?e.state:{...readURL(location.search),y:null};
  // our own step back after "Show N events": keep the applied filters on this entry
  if(pendingApply&&!OPEN){flushApply();return;}
  const want=st.about?"about":st.filters?"filters":st.home?"home":st.ev||"",ua=!!e.hasUAVisualTransition;
  // Back while a sheet is sliding out: that entry is already gone, so do not step back again. Going to

  if(sheet.open&&sheet.classList.contains("closing")){
    if(want){clearTimeout(closeTimer);closeTimer=0;sheet.classList.remove("closing");closingFromPop=false;}
    else{closingFromPop=true;finishClose();}
  }
  // the browser has already animated Back: close without the slide
  if(OPEN&&!want)closeSheet(true,ua);
  const cur=viewOf();
  const restore=o=>{applyView(st);$("#search").value=S.qt;const g=render({keep:true,...o});if(typeof st.y==="number"){flushToY(st.y);scrollTo(0,st.y);}return g;};
  if(VIEWKEYS.some(k=>cur[k]!==st[k])){if(st.mode!==cur.mode)withTabTransition(restore,ua);else restore({});}

// The sheet's date line, with the time when there is one (a span's time is daily hours).
function dateLine(o){
  const t=timeOf(o);
  if(isWeekly(o)){const i=DOW.indexOf(o.day);
    return (i>=0?`Every ${DOWF[i]}`:(DAYLABEL[o.day]||o.day))+(t?", "+t:"")+(o.seasonEnd?` · Through ${longDate(pd(o.seasonEnd))}`:"");}
  if(isOngoing(o))return `Runs through ${longDate(lastDay(o))}`+(t?` · ${t} daily`:"");
  if(o.dates){
    const up=o.dates.map(pd).filter(d=>d>=today),ds=up.length?up:[lastDay(o)];
    return ds.slice(0,6).map(d=>`${MON[d.getMonth()]} ${d.getDate()}`).join(", ")+(ds.length>6?` +${ds.length-6} more`:"")+(t?` · ${t}`:"");
  }
  if(o.end&&o.end!==o.start)return `${shortDate(pd(o.start))} - ${shortDate(pd(o.end))}`+(t?` · ${t} daily`:"");

}
function distLine(o){

    document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
    if(live)live.textContent="Calendar file downloaded";
  }catch(e){if(live)live.textContent="Could not make the calendar file on this device";}
}

// Theme: light by default, dark only when tapped. The choice is remembered when storage allows it.
// Both theme-color tags carry the active theme's --bg: the theme is the app's choice, not the phone's.
// The switch lives in the About sheet.
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute("content",t==="dark"?"#0F1420":"#EFF2F7"));const sw=$("#themeSwitch");if(sw)sw.setAttribute("aria-checked",t==="dark");}
let theme="light";try{if(localStorage.getItem("ev_theme")==="dark")theme="dark";}catch(e){}
applyTheme(theme);
function setTheme(t){theme=t;try{localStorage.setItem("ev_theme",theme);}catch(e){}applyTheme(theme);setBarH();}

// Large title: once the header has scrolled away, the stuck bar shows the short title and its shadow.
// Only visibility and box-shadow change, so nothing moves.
if("IntersectionObserver" in window)new IntersectionObserver(([en])=>{const bar=$(".bar");bar.classList.toggle("collapsed",!en.isIntersecting);bar.classList.toggle("under",!en.isIntersecting);}).observe($(".top"));

$("#search").value=S.qt;
renderHomeBtn();setMeta();render({keep:true});
if(U0.ev){openSheet(U0.ev);replaceURL();}
else{const y=curState().y;if(typeof y==="number"&&y>0){flushToY(y);scrollTo(0,y);}}

// Service worker (installable app + offline copy). GitHub Pages only: the same file also runs as a Cowork artifact.
// sw.js is network-first for the page - see CLAUDE.md before changing it.
if("serviceWorker" in navigator&&location.hostname.endsWith("github.io"))navigator.serviceWorker.register("sw.js").catch(e=>console.warn("Service worker registration failed:",e));

// Install button (Chrome/Edge): shown only when the browser offers an install via beforeinstallprompt.
// A prompt can be used once; the browser fires the event again later if the site is still installable.
let installEvt=null;const installBtn=$("#installBtn");
function hideInstall(){if(document.activeElement===installBtn)$("#aboutBtn").focus();installBtn.hidden=true;}
addEventListener("beforeinstallprompt",e=>{
  if(matchMedia("(display-mode: standalone)").matches)return;
  e.preventDefault();installEvt=e;installBtn.hidden=false;});
installBtn.addEventListener("click",async()=>{
  if(!installEvt)return;const e=installEvt;
  try{await e.prompt();await e.userChoice;}catch(err){console.warn("Install prompt failed:",err);}
  installEvt=null;$("#aboutBtn").focus();installBtn.hidden=true;});
addEventListener("appinstalled",()=>{installEvt=null;hideInstall();});
</script>

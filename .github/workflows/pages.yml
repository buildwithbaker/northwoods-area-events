# Deploys the site to GitHub Pages (added 2026-11-08).
#
# Replaces the legacy "deploy from a branch" build. Same Jekyll build, so the
# site renders exactly as before. Runs on any push to main (a human merge) and
# on workflow_dispatch, which scan-automerge.yml calls after it merges a scan:
# GitHub does not start workflows or Pages builds for commits made with a
# workflow's own GITHUB_TOKEN, so that merge has to request the deploy itself.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
